[package]
name = "billflow-tauri"
version.workspace = true
edition.workspace = true
description = "BillFlow desktop shell built with Tauri 2"

[lib]
name = "billflow_tauri_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = "1"
billflow-shared = { path = "../shared" }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"

[features]
# This crate does not use the default Tauri feature set; no extra features.
default = []
