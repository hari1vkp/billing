[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "billflow-product-mcp"
version = "0.1.0"
description = "Product discovery MCP server for BillFlow (external catalogues only, no inventory management)"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.20,<2",
  "httpx>=0.27",
  "pydantic>=2.6",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
billflow-product-mcp = "billflow_product_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
